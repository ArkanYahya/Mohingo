# Mohingo CI: the checks a contributor runs locally, then an installable
# Android APK and an unsigned iOS build, so a change can be put on a phone
# without a development machine that can build Flutter. See docs/TESTING.md
# ("CI") and README.md ("Trying a build on a phone").
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with README.md's Prerequisites.
  FLUTTER_VERSION: 3.47.2

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # A release build, so the on-device meaning signal is timed as a
      # learner would see it, not in debug mode. It signs with the runner's
      # debug key (android/app/build.gradle.kts), which differs from run to
      # run: uninstall the previous build before installing a new one.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mohingo-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-build:
    name: iOS build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Proves the iOS project and every plugin (flutter_onnxruntime through
      # CocoaPods among them) compile. Installing on an iPhone needs an Apple
      # developer account to sign with; that is not done here.
      - run: flutter build ios --release --no-codesign
