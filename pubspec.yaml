name: mohingo
description: "Offline-first, bilingual (Arabic/English) CEFR English-learning app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_tts: ^4.2.5
  go_router: ^18.0.0
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.1
  riverpod_annotation: ^4.0.6
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  sqlite3: ^3.5.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.8
  drift_dev: ^2.34.5
  riverpod: ^3.4.2

# permission_handler_android 14.0.0 (a transitive dep of permission_handler
# ^13.0.1) bumped its own compileSdk requirement to 37 — but Android SDK 37
# isn't published as a plain, Gradle-resolvable `android-37` platform yet
# (only preview/dotted revisions like 37.0/37.1/37.2-betaN exist as of this
# writing), so any app pulling 14.0.0 fails to build with "Failed to find
# target with hash string 'android-37'" regardless of what compileSdk value
# the app itself declares. Pinned back to the last working pre-breaking
# release until Android SDK 37 actually ships as a stable, resolvable
# platform — see docs/TECH_STACK.md.
dependency_overrides:
  permission_handler_android: 13.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/en/A1/a1-course-bundle.json
