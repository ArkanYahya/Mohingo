name: mohingo
description: "Mohingo: an offline-first, bilingual (Arabic/English) CEFR English course."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  audioplayers: ^6.8.1
  cloud_firestore: ^6.10.0
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.6
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_onnxruntime: ^1.9.0
  flutter_riverpod: ^3.4.2
  flutter_tts: ^4.2.5
  go_router: ^18.0.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.1
  riverpod_annotation: ^4.0.6
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  sqlite3: ^3.5.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.8
  drift_dev: ^2.34.5
  riverpod: ^3.4.2
  flutter_launcher_icons: ^0.14.4

# permission_handler_android 14.0.0 (a transitive dep of permission_handler
# ^13.0.1) bumped its own compileSdk requirement to 37 — but Android SDK 37
# isn't published as a plain, Gradle-resolvable `android-37` platform yet
# (only preview/dotted revisions like 37.0/37.1/37.2-betaN exist as of this
# writing), so any app pulling 14.0.0 fails to build with "Failed to find
# target with hash string 'android-37'" regardless of what compileSdk value
# the app itself declares. Pinned back to the last working pre-breaking
# release until Android SDK 37 actually ships as a stable, resolvable
# platform — see docs/TECH_STACK.md.
dependency_overrides:
  permission_handler_android: 13.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/en/A1/a1-course-bundle.json
    - assets/content/en/A2/a2-course-bundle.json
    - assets/sounds/correct.wav
    - assets/sounds/incorrect.wav
    # The app icon shown inside the app (splash, first-run, About).
    - assets/brand/mohingo_mark.png
    # The privacy policy and terms of use, one Markdown file per language
    # (lib/features/legal/). Edit them there; raise kAgreementVersion only
    # for a change learners must accept again.
    - assets/legal/
    # Bundled speech clips, one manifest and one clips folder per level
    # (ADR 0008). Regenerate with tool/audio/generate_audio.py.
    - assets/audio/en/A1/
    - assets/audio/en/A1/clips/
    - assets/audio/en/A2/
    - assets/audio/en/A2/clips/
    # The on-device sentence-embedding model behind the meaning signal
    # (ADR 0013) and its vocabulary; licence in assets/models/NOTICE.md.
    - assets/models/all-MiniLM-L6-v2-int8.onnx
    - assets/models/all-MiniLM-L6-v2-vocab.txt
    # The natural-language-inference model that reads a free answer part by
    # part (ADR 0014): model.onnx, vocab.txt and config.json, fetched by
    # tool/meaning/fetch_nli_model.sh; the folder's README says how. Listed
    # as a folder so a checkout without the files still builds.
    - assets/models/nli/

# App icon (Android + iOS). Sources live in assets/icon/ and are not bundled
# into the app. Regenerate after changing them:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # Android 8+ masks the icon to the launcher's shape; the background carries
  # the whole artwork inside the 66dp safe zone so no mask clips the M.
  adaptive_icon_background: assets/icon/app_icon_adaptive_background.png
  adaptive_icon_foreground: assets/icon/app_icon_adaptive_foreground.png
  min_sdk_android: 21
